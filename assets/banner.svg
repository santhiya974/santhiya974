<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14">
        <animate attributeName="stop-color" values="#0b0f14;#0d1420;#0b0f14" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#121821">
        <animate attributeName="stop-color" values="#121821;#101b2b;#121821" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d6c9"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#39d6c9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d6c9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39d6c9" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- looping typewriter clip: types "Hi there i'm santhiya", holds, deletes, repeats -->
    <clipPath id="typeClip">
      <rect x="0" y="70" height="55" width="0">
        <animate attributeName="width"
          values="0;0;660;660;660;0;0"
          keyTimes="0;0.03;0.42;0.60;0.62;0.95;1"
          dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- drifting binary specks (background tech texture) -->
  <g fill="#1f7a70" opacity="0.35" font-family="SFMono-Regular, Consolas, monospace" font-size="12">
    <text x="200" y="40">01</text>
    <text x="700" y="230">10</text>
    <text x="950" y="60">11</text>
    <text x="400" y="245">01</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="7s" repeatCount="indefinite"/>
      <text x="850" y="130">10</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,12; 0,0" dur="9s" repeatCount="indefinite"/>
      <text x="300" y="90">01</text>
    </g>
  </g>

  <!-- subtle grid -->
  <g stroke="#1e2733" stroke-width="1">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
    <line x1="150" y1="0" x2="150" y2="260"/>
    <line x1="1050" y1="0" x2="1050" y2="260"/>
  </g>

  <!-- animated circuit traces flowing along grid lines -->
  <line x1="0" y1="65" x2="1200" y2="65" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="40 900" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-1400" dur="8s" repeatCount="indefinite"/>
  </line>
  <line x1="1200" y1="195" x2="0" y2="195" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="40 900" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-1400" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- traveling data particles -->
  <circle r="3" fill="#39d6c9" filter="url(#softGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M -10,65 L 1210,65"/>
  </circle>
  <circle r="2.5" fill="#3b82f6" filter="url(#softGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" begin="1.5s" path="M 1210,195 L -10,195"/>
  </circle>

  <!-- corner bracket accents, pulsing -->
  <path d="M40 40 L40 70 M40 40 L70 40" stroke="#39d6c9" stroke-width="2" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M1160 220 L1160 190 M1160 220 L1130 220" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- code-bracket mark, glowing -->
  <text x="60" y="150" font-family="SFMono-Regular, Consolas, monospace" font-size="46" fill="url(#accent)" font-weight="700" filter="url(#softGlow)">
    &lt;/&gt;
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- looping typewriter greeting -->
  <g clip-path="url(#typeClip)">
    <text x="150" y="115" font-family="SFMono-Regular, Consolas, monospace" font-size="42" fill="#e6edf3" font-weight="700">Hi there i'm santhiya</text>
  </g>
  <!-- typing cursor, moves with the text and blinks -->
  <rect y="80" width="3" height="38" fill="#39d6c9">
    <animate attributeName="x"
      values="150;150;808;808;808;150;150"
      keyTimes="0;0.03;0.42;0.60;0.62;0.95;1"
      dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- role -->
  <text x="150" y="150" font-family="SFMono-Regular, Consolas, monospace" font-size="20" fill="#39d6c9" font-weight="500">
    Software Developer &#183; Full Stack Developer
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- tagline -->
  <text x="150" y="182" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8b98a5">MERN Stack &#8226; Python &#8226; REST APIs &#8226; Computer Vision</text>

  <!-- status line with radar-ping live dot -->
  <circle cx="150" cy="210" r="10" fill="url(#glowDot)">
    <animate attributeName="r" values="4;12;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="210" r="4" fill="#39d6c9"/>
  <text x="164" y="215" font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#5b6b78">status: open to opportunities</text>
</svg>
