<svg width="360" height="280" viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#153039" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#173036"/>
      <stop offset="100%" stop-color="#0e1a1e"/>
    </linearGradient>
  </defs>

  <rect width="360" height="280" fill="#0b0f14"/>
  <circle cx="180" cy="150" r="140" fill="url(#glow)">
    <animate attributeName="r" values="130;145;130" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g fill="#39d6c9">
    <circle cx="55" cy="70" r="2" opacity="0.7">
      <animate attributeName="cy" values="70;50;70" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="305" cy="90" r="2.5" opacity="0.6" fill="#3b82f6">
      <animate attributeName="cy" values="90;65;90" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="235" r="2" opacity="0.5">
      <animate attributeName="cy" values="235;218;235" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="285" cy="225" r="2" opacity="0.6" fill="#3b82f6">
      <animate attributeName="cy" values="225;208;225" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="35" y="115" font-family="SFMono-Regular, Consolas, monospace" font-size="20" fill="#39d6c9" opacity="0.5">&lt;/&gt;</text>
  <text x="295" y="150" font-family="SFMono-Regular, Consolas, monospace" font-size="18" fill="#3b82f6" opacity="0.45">{ }</text>
  <text x="45" y="205" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#39d6c9" opacity="0.35">01</text>
  <text x="275" y="95" font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#3b82f6" opacity="0.3">10</text>

  <!-- person peeking behind the monitor -->
  <circle cx="180" cy="100" r="17" fill="#1e2733"/>
  <path d="M148 150 Q148 116 180 116 Q212 116 212 150 Z" fill="#1e2733"/>

  <!-- desk -->
  <rect x="70" y="222" width="220" height="6" rx="2" fill="#1e2733"/>

  <!-- laptop base -->
  <path d="M110 222 L250 222 L262 236 L98 236 Z" fill="#151d26" stroke="#26313d" stroke-width="1"/>

  <!-- laptop screen (covers the person's lower shoulders) -->
  <rect x="120" y="120" width="120" height="100" rx="6" fill="#0e1a1e" stroke="#26313d" stroke-width="2"/>
  <rect x="128" y="128" width="104" height="84" rx="2" fill="url(#screenGlow)"/>

  <g fill="#39d6c9">
    <rect x="136" y="138" height="4" rx="2" width="10">
      <animate attributeName="width" values="10;58;58;10" keyTimes="0;0.3;0.8;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="136" y="150" height="4" rx="2" width="8" fill="#3b82f6">
      <animate attributeName="width" values="8;44;44;8" keyTimes="0;0.35;0.8;1" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="136" y="162" height="4" rx="2" width="12">
      <animate attributeName="width" values="12;66;66;12" keyTimes="0;0.3;0.8;1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="136" y="174" height="4" rx="2" width="6" fill="#3b82f6">
      <animate attributeName="width" values="6;36;36;6" keyTimes="0;0.4;0.8;1" dur="4s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="136" y="186" height="4" rx="2" width="10">
      <animate attributeName="width" values="10;60;60;10" keyTimes="0;0.3;0.8;1" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="136" y="198" width="8" height="4" fill="#39d6c9">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
